<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Parallax — Site Your Story</title>
<meta name="description" content="Scroll-driven parallax scene — a layered, cinematic depth effect built on GSAP ScrollTrigger and Lenis smooth scroll.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#060608">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="assets/css/parallax.css?v=20260731i">

<style>
  /* Minimal reset so the demo page stands on its own without main.css. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060608; color: #fff; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
</style>
</head>

<body>

<!-- ParallaxComponent — vanilla port of src/components/ui/parallax-scrolling.tsx.
     The markup hooks (.parallax, [data-parallax-layers], [data-parallax-layer])
     are unchanged, so assets/js/parallax.js drives it exactly like the original
     useEffect did. -->
<div class="parallax">
  <section class="parallax__header">
    <div class="parallax__visuals">
      <div class="parallax__black-line-overflow"></div>
      <div data-parallax-layers class="parallax__layers">
        <img src="assets/img/parallax/layer-3.webp" loading="eager" width="800" data-parallax-layer="1" alt="" class="parallax__layer-img">
        <img src="assets/img/parallax/layer-2.webp" loading="eager" width="800" data-parallax-layer="2" alt="" class="parallax__layer-img">
        <div data-parallax-layer="3" class="parallax__layer-title">
          <h2 class="parallax__title">Parallax</h2>
        </div>
        <img src="assets/img/parallax/layer-1.webp" loading="eager" width="800" data-parallax-layer="4" alt="" class="parallax__layer-img">
      </div>
      <div class="parallax__fade"></div>
    </div>
  </section>

  <section class="parallax__content">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 160 160" fill="none" class="osmo-icon-svg" aria-hidden="true">
      <path d="M94.8284 53.8578C92.3086 56.3776 88 54.593 88 51.0294V0H72V59.9999C72 66.6273 66.6274 71.9999 60 71.9999H0V87.9999H51.0294C54.5931 87.9999 56.3777 92.3085 53.8579 94.8283L18.3431 130.343L29.6569 141.657L65.1717 106.142C67.684 103.63 71.9745 105.396 72 108.939V160L88.0001 160L88 99.9999C88 93.3725 93.3726 87.9999 100 87.9999H160V71.9999H108.939C105.407 71.9745 103.64 67.7091 106.12 65.1938L106.142 65.1716L141.657 29.6568L130.343 18.3432L94.8284 53.8578Z" fill="currentColor"></path>
    </svg>
  </section>
</div>

<div class="osmo-credits">
  <p class="osmo-credits__p">Resource by <a target="_blank" rel="noopener" href="https://www.osmo.supply/" class="osmo-credits__p-a">Osmo</a></p>
</div>

<!-- Same library versions the rest of the site uses. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js" defer></script>
<script src="assets/js/parallax.js?v=20260731i" defer></script>

</body>
</html>
